<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: sans-serif;
        outline: none;
        background-color: #fff;
      }
      h1 {
        text-align: center;
        margin-top: 10px;
        color: #0ef;
        position: relative;
        top: 80px;
      }
      .container {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        /* border: #0ef 2px solid; */
      }
      .calculator {
        background-color: #ecf0f3;
        padding: 15px;
        border-radius: 30px;
        box-shadow: inset 5px 5px 12px #ffffff, 5px 5px 12px rgba(0, 0, 0, 0.16);
        display: grid;
        grid-template-columns: repeat(4, 68px);
        /* border: #0ef 2px solid; */
        box-shadow: 0 0 20px #0ef;
      }
      input {
        grid-column: span 4;
        height: 70px;
        width: 260px;
        background-color: #ecf0f3;
        box-shadow: inset -5px -5px 12px #ffffff,
          inset 5px 5px 12px rgba(0, 0, 0, 0.16);
        border: none;
        border-radius: 30px;
        color: rgba(70, 70, 70);
        font-size: 30px;
        text-align: end;
        margin: auto;
        margin-top: 40px;
        margin-bottom: 40px;
        padding: 20px;
      }
      button {
        height: 48px;
        width: 48px;
        border: none;

        background-color: #ecf0f3;
        box-shadow: inset -5px -5px 12px #ffffff,
          5px 5px 12px rgba(0, 0, 0, 0.16);
        border: none;
        border-radius: 50%;
        margin: 8px;
        color: black;
        font-size: 16px;
        cursor: pointer;
      }
      button:hover {
        border: 2px solid #0ef;
      }
      .equal {
        width: 115px;
        border-radius: 40px;
        background-color: #ecf0f3;
        box-shadow: inset -5px -5px 12px #ffffff,
          5px 5px 12px rgba(0, 0, 0, 0.16);
      }
    </style>
  </head>
  <body>
    <h1>Calculator</h1>

    <div class="container">
      <div class="calculator">
        <input type="text" placeholder="0" id="result" />
        <button onclick="Clear()">CL</button>
        <button onclick="del()">DEL</button>
        <button onclick="display('%')">%</button>
        <button onAclick="display('/')">/</button>
        <button onclick="display('7')">7</button>
        <button onclick="display('8')">8</button>
        <button onclick="display('9')">9</button>
        <button onclick="display('*')">*</button>
        <button onclick="display('4')">4</button>
        <button onclick="display('5')">5</button>
        <button onclick="display('6')">6</button>
        <button onclick="display('-')">-</button>
        <button onclick="display('1')">1</button>
        <button onclick="display('2')">2</button>
        <button onclick="display('3')">3</button>
        <button onclick="display('+')">+</button>
        <button onclick="display('.')">.</button>
        <button onclick="display('0')">0</button>
        <button onclick="Calculate()" class="equal">=</button>
      </div>
    </div>
    <script>
      let outoutscreen = document.getElementById("result");

      function display(num) {
        outoutscreen.value += num;
      }
      function Calculate() {
        try {
          outoutscreen.value = eval(outoutscreen.value);
        } catch (error) {
          alert("Invalid Input");
        }
      }
      function Clear() {
        outoutscreen.value = "";
      }
      function del() {
        outoutscreen.value = outoutscreen.value.slice(0, -1);
      }
    </script>
  </body>
</html>
